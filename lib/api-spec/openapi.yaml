openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard statistics and charts
  - name: patients
    description: Patient operations
  - name: appointments
    description: Appointment operations
  - name: alerts
    description: Alert operations
  - name: beds
    description: Bed occupancy
  - name: or
    description: Operating room status
  - name: blood-bank
    description: Blood bank stock
  - name: vehicles
    description: Vehicle / ambulance fleet
  - name: medications
    description: Pharmacy / medication stock
  - name: consultations
    description: Consultation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns aggregated KPIs for the main dashboard
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/charts/consultations:
    get:
      operationId: getConsultationsChart
      tags: [dashboard]
      summary: Get 7-day consultations chart data
      responses:
        "200":
          description: Consultations and appointments per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsultationChartPoint"

  /dashboard/charts/admissions:
    get:
      operationId: getAdmissionsChart
      tags: [dashboard]
      summary: Get 7-day admissions chart data
      responses:
        "200":
          description: Admissions and discharges per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdmissionChartPoint"

  /dashboard/charts/services:
    get:
      operationId: getServicesChart
      tags: [dashboard]
      summary: Get admissions by service (pie chart)
      responses:
        "200":
          description: Admissions distribution by medical service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceChartPoint"

  /patients/recent:
    get:
      operationId: getRecentPatients
      tags: [patients]
      summary: Get recently registered patients
      responses:
        "200":
          description: List of recent patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentPatient"

  /patients:
    get:
      operationId: getPatientsList
      tags: [patients]
      summary: Get full patient list
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - name: bloodType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Full patient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientListItem"

  /appointments/upcoming:
    get:
      operationId: getUpcomingAppointments
      tags: [appointments]
      summary: Get upcoming appointments for today
      responses:
        "200":
          description: List of upcoming appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingAppointment"

  /appointments:
    get:
      operationId: getAppointmentsList
      tags: [appointments]
      summary: Get full appointment list
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Full appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentListItem"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListItem"
        "400":
          description: Invalid input

  /appointments/{id}:
    patch:
      operationId: updateAppointmentStatus
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentStatusBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListItem"
        "404":
          description: Not found

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get active alerts with full details
      responses:
        "200":
          description: List of active alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertItem"

  /alerts/read-all:
    post:
      operationId: markAllAlertsRead
      tags: [alerts]
      summary: Mark all active alerts as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResult"

  /alerts/{id}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark a single alert as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated alert read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkReadResult"
        "404":
          description: Not found

  /consultations:
    get:
      operationId: getConsultationsList
      tags: [consultations]
      summary: Get full consultation list
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: origin
          in: query
          schema:
            type: string
        - name: doctor
          in: query
          schema:
            type: string
        - name: specialty
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Full consultation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsultationListItem"
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Create a new consultation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultationBody"
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationListItem"
        "400":
          description: Invalid input

  /consultations/{id}:
    patch:
      operationId: updateConsultationStatus
      tags: [consultations]
      summary: Update consultation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsultationStatusBody"
      responses:
        "200":
          description: Updated consultation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationListItem"
        "404":
          description: Not found

  /beds/summary:
    get:
      operationId: getBedsSummary
      tags: [beds]
      summary: Get bed occupancy summary
      responses:
        "200":
          description: Aggregated bed occupancy across all services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedsSummary"

  /or/status:
    get:
      operationId: getOrStatus
      tags: [or]
      summary: Get operating room status
      responses:
        "200":
          description: Count of operating rooms by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrStatus"

  /blood-bank/summary:
    get:
      operationId: getBloodBankSummary
      tags: [blood-bank]
      summary: Get blood bank stock summary
      responses:
        "200":
          description: Aggregated blood bank totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodBankSummary"

  /medications:
    get:
      operationId: getMedications
      tags: [medications]
      summary: Get paginated medication list with stock status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, ok, low, critical, expired]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated medication list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationPage"

  /medications/{id}:
    patch:
      operationId: updateMedicationStock
      tags: [medications]
      summary: Update medication stock quantity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicationStockBody"
      responses:
        "200":
          description: Updated medication id and quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationStockUpdate"
        "400":
          description: Invalid input
        "404":
          description: Medication not found

  /vehicles/status:
    get:
      operationId: getVehiclesStatus
      tags: [vehicles]
      summary: Get vehicle fleet status
      responses:
        "200":
          description: Count of vehicles by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehiclesStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      properties:
        totalPatients:
          type: number
        appointmentsToday:
          type: number
        hospitalized:
          type: number
        admissionsToday:
          type: number
        emergenciesWaiting:
          type: number
        consultationsToday:
          type: number
        analysesToday:
          type: number
        imagingToday:
          type: number
        invoicesToday:
          type: number
        revenueToday:
          type: number
        bedOccupancyPercent:
          type: number
      required:
        - totalPatients
        - appointmentsToday
        - hospitalized
        - admissionsToday
        - emergenciesWaiting
        - consultationsToday
        - analysesToday
        - imagingToday
        - invoicesToday
        - revenueToday
        - bedOccupancyPercent

    ConsultationChartPoint:
      type: object
      properties:
        name:
          type: string
        consultations:
          type: number
        rendezVous:
          type: number
      required:
        - name
        - consultations
        - rendezVous

    AdmissionChartPoint:
      type: object
      properties:
        name:
          type: string
        admissions:
          type: number
        sorties:
          type: number
      required:
        - name
        - admissions
        - sorties

    ServiceChartPoint:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
      required:
        - name
        - value

    RecentPatient:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        age:
          type: number
        fileNumber:
          type: string
        service:
          type: string
        registeredAt:
          type: string
      required:
        - id
        - name
        - age
        - fileNumber
        - service
        - registeredAt

    PatientMedicalInfo:
      type: object
      properties:
        allergies:
          type: array
          items:
            type: string
        chronicDiseases:
          type: array
          items:
            type: string
        majorHistory:
          type: array
          items:
            type: string
      required:
        - allergies
        - chronicDiseases
        - majorHistory

    PatientListItem:
      type: object
      properties:
        id:
          type: string
        mpiId:
          type: string
        fileNumber:
          type: string
        internalNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
        phone:
          type: string
        bloodType:
          type: string
          nullable: true
        status:
          type: string
        syncStatus:
          type: string
        isIncomplete:
          type: boolean
        potentialDuplicate:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        nationality:
          type: string
        country:
          type: string
        medical:
          $ref: "#/components/schemas/PatientMedicalInfo"
        createdById:
          type: string
        siteId:
          type: string
        service:
          type: string
      required:
        - id
        - mpiId
        - fileNumber
        - internalNumber
        - firstName
        - lastName
        - gender
        - dateOfBirth
        - phone
        - status
        - syncStatus
        - isIncomplete
        - potentialDuplicate
        - createdAt
        - updatedAt
        - nationality
        - country
        - medical
        - createdById
        - siteId
        - service

    UpcomingAppointment:
      type: object
      properties:
        id:
          type: number
        patientName:
          type: string
        service:
          type: string
        doctorName:
          type: string
        scheduledAt:
          type: string
        status:
          type: string
      required:
        - id
        - patientName
        - service
        - doctorName
        - scheduledAt
        - status

    AppointmentPatient:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      required:
        - id
        - firstName
        - lastName

    AppointmentListItem:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        patient:
          $ref: "#/components/schemas/AppointmentPatient"
        doctorId:
          type: string
        doctorName:
          type: string
        departmentId:
          type: string
        departmentName:
          type: string
        scheduledAt:
          type: string
        duration:
          type: number
        status:
          type: string
        notes:
          type: string
          nullable: true
      required:
        - id
        - patientId
        - patient
        - doctorId
        - doctorName
        - departmentId
        - departmentName
        - scheduledAt
        - duration
        - status

    CreateAppointmentBody:
      type: object
      properties:
        patientName:
          type: string
        patientFirstName:
          type: string
        patientLastName:
          type: string
        doctorName:
          type: string
        departmentName:
          type: string
        scheduledAt:
          type: string
        duration:
          type: number
        notes:
          type: string
        status:
          type: string
      required:
        - doctorName
        - scheduledAt

    UpdateAppointmentStatusBody:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AlertItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        description:
          type: string
        severity:
          type: string
        category:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
        patientId:
          type: string
          nullable: true
      required:
        - id
        - type
        - title
        - detail
        - description
        - severity
        - category
        - isRead
        - createdAt

    MarkReadResult:
      type: object
      properties:
        id:
          type: string
        isRead:
          type: boolean
      required:
        - id
        - isRead

    MarkAllReadResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ConsultationListItem:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        patientMpi:
          type: string
        doctorId:
          type: string
        doctorName:
          type: string
        specialty:
          type: string
        serviceId:
          type: string
        serviceName:
          type: string
        siteId:
          type: string
        siteName:
          type: string
        date:
          type: string
        scheduledAt:
          type: string
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        duration:
          type: number
          nullable: true
        type:
          type: string
        origin:
          type: string
        reason:
          type: string
        status:
          type: string
        syncStatus:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        createdById:
          type: string
      required:
        - id
        - number
        - patientId
        - patientName
        - patientMpi
        - doctorId
        - doctorName
        - specialty
        - serviceId
        - serviceName
        - siteId
        - siteName
        - date
        - scheduledAt
        - type
        - origin
        - reason
        - status
        - syncStatus
        - createdAt
        - updatedAt
        - createdById

    CreateConsultationBody:
      type: object
      properties:
        patientName:
          type: string
        patientMpi:
          type: string
        patientId:
          type: number
        doctorName:
          type: string
        specialty:
          type: string
        serviceName:
          type: string
        date:
          type: string
        type:
          type: string
        origin:
          type: string
        reason:
          type: string
        status:
          type: string
        duration:
          type: number
      required:
        - patientName
        - doctorName
        - reason

    UpdateConsultationStatusBody:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BedsSummary:
      type: object
      properties:
        occupied:
          type: number
        free:
          type: number
        cleaning:
          type: number
        outOfService:
          type: number
        total:
          type: number
        occupancyPercent:
          type: number
      required:
        - occupied
        - free
        - cleaning
        - outOfService
        - total
        - occupancyPercent

    OrStatus:
      type: object
      properties:
        totalRooms:
          type: number
        available:
          type: number
        occupied:
          type: number
        prep:
          type: number
      required:
        - totalRooms
        - available
        - occupied
        - prep

    BloodBankSummary:
      type: object
      properties:
        totalBags:
          type: number
        available:
          type: number
        urgentRequests:
          type: number
        expiringSoon:
          type: number
      required:
        - totalBags
        - available
        - urgentRequests
        - expiringSoon

    MedicationItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit:
          type: string
        lowStockThreshold:
          type: integer
        expiryDate:
          type: string
          nullable: true
        expiringSoon:
          type: boolean
        status:
          type: string
          enum: [ok, low, critical, expired]
        createdAt:
          type: string
      required:
        - id
        - name
        - quantity
        - unit
        - lowStockThreshold
        - expiryDate
        - expiringSoon
        - status
        - createdAt

    MedicationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MedicationItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - data
        - total
        - page
        - pageSize

    UpdateMedicationStockBody:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
      required:
        - quantity

    MedicationStockUpdate:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
      required:
        - id
        - quantity

    VehiclesStatus:
      type: object
      properties:
        total:
          type: number
        inService:
          type: number
        available:
          type: number
        maintenance:
          type: number
      required:
        - total
        - inService
        - available
        - maintenance
