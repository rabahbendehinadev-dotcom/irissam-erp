# ─────────────────────────────────────────────────────────────────────────────
# IRISSAM Hospital ERP — Production Nginx Reverse Proxy
#
# Routing:
#   /api/*          → api-server:3001   (JSON API + file uploads/downloads)
#   /patient-portal/ → patient-portal:80 (Patient portal SPA)
#   /               → irissam-erp:80    (Main ERP SPA — catch-all)
#
# Security:
#   - /app/storage and /data/* are NEVER served by nginx directly
#   - File downloads always go through /api/storage/objects/:uuid (backend)
#   - Large upload buffer to support 50 MB file uploads
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Upload size: 52 MB (50 MB file + headers/boundary)
    client_max_body_size 52m;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream api_server {
        server api-server:3001;
        keepalive 32;
    }

    upstream erp_frontend {
        server irissam-erp:80;
    }

    upstream patient_portal {
        server patient-portal:80;
    }

    # ── HTTP → HTTPS redirect (uncomment when SSL cert is configured) ────────
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl http2;
        server_name _;

        # ssl_certificate     /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN"           always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy "strict-origin"        always;
        add_header X-XSS-Protection "1; mode=block"       always;

        # ── CRITICAL: block direct storage access ────────────────────────────
        location ~ ^/(app/storage|data/irissam) {
            return 403 "Direct storage access is forbidden";
        }

        # ── API backend ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_server;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts (generous for large uploads/PDF generation)
            proxy_connect_timeout 30s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Buffer for upload requests
            proxy_request_buffering off;

            # Medical file downloads must not be cached by nginx
            proxy_no_cache        1;
            proxy_cache_bypass    1;
        }

        # ── Patient Portal ────────────────────────────────────────────────────
        location /patient-portal/ {
            proxy_pass         http://patient_portal/;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Main ERP (catch-all) ──────────────────────────────────────────────
        location / {
            proxy_pass         http://erp_frontend;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
