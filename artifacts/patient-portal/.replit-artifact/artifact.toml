kind = "web"
previewPath = "/patient-portal/"
title = "IRISSAM — Portail Patient"
description = "Patient self-service portal for IRISSAM Hospital. Patients can view appointments, lab results, imaging reports, prescriptions, invoices, and documents. Supports appointment requests, secure messaging, consent signing, and PWA install. Trilingual (FR/AR RTL/EN). Responsive for mobile, tablet, and desktop with bottom navigation on mobile."
version = "1.0.0"
id = "artifacts/patient-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/patient-portal/" ]
localPort = 24832

[services.development]
run = "pnpm --filter @workspace/patient-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/patient-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/patient-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24832"
BASE_PATH = "/patient-portal/"
