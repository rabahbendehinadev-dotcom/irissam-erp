<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: no user-scale to prevent accidental zooms; viewport-fit=cover for iPhone notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <title>IRISSAM HOSPITAL ERP</title>
    <meta name="description" content="Système de Gestion Hospitalière IRISSAM — Patients, Admissions, Consultations, Facturation." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="background-color" content="#1B2A4A" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Apple / iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRISSAM ERP" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Android / Generic PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="IRISSAM ERP" />

    <!-- Open Graph -->
    <meta property="og:title" content="IRISSAM HOSPITAL ERP" />
    <meta property="og:description" content="Système de Gestion Hospitalière" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Service Worker registration (inline for reliability) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(function(reg) { console.log('[SW] Registered', reg.scope); })
            .catch(function(err) { console.warn('[SW] Registration failed', err); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
